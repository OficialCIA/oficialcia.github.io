<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayque Olimpio | Gestão Pública e Juventude</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    body { font-family: 'Inter', sans-serif; }

    /* Animação de entrada suave */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(40px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animação de flutuação contínua para a foto */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    /* Classes utilitárias das animações */
    .animate-fade-up {
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .animate-float {
      animation: float 6s ease-in-out infinite;
    }

    /* Delays em cascata */
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 300ms; }
    .delay-300 { animation-delay: 500ms; }
    .delay-400 { animation-delay: 700ms; }
    .delay-500 { animation-delay: 900ms; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center overflow-x-hidden">

  <main class="container mx-auto px-6 py-16 md:py-24 max-w-6xl">
    <div class="flex flex-col-reverse md:flex-row items-center justify-between gap-12">
      
      <!-- Coluna de Texto -->
      <div class="w-full md:w-1/2 flex flex-col items-center md:items-start text-center md:text-left">
        <span class="animate-fade-up delay-100 text-emerald-400 font-semibold tracking-wider uppercase text-sm mb-2">
          Gestão Pública & Movimento Estudantil
        </span>
        
        <h1 class="animate-fade-up delay-200 text-4xl md:text-6xl font-extrabold text-white leading-tight mb-6">
          Kayque Olimpio
        </h1>
        
        <p class="animate-fade-up delay-300 text-lg text-slate-300 mb-8 leading-relaxed max-w-lg">
          Construindo pontes entre a juventude e o debate político. Acredito na gestão pública como ferramenta de transformação social e na participação ativa para desenhar o futuro.
        </p>
        
        <!-- Botões -->
        <div class="animate-fade-up delay-400 flex flex-wrap justify-center md:justify-start gap-4 w-full">
          <!-- Botão do Instagram -->
          <a href="https://www.instagram.com/kayqueolimpio/" target="_blank" rel="noopener noreferrer" class="px-6 py-3 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold transition-all duration-300 shadow-lg hover:shadow-emerald-500/50 hover:-translate-y-1 text-center">
            Instagram
          </a>
          <!-- Botão do Blog -->
          <a href="#blog" class="px-6 py-3 rounded-full border border-slate-600 hover:border-slate-300 text-slate-300 hover:text-white transition-all duration-300 hover:-translate-y-1 text-center">
            Blog
          </a>
          <!-- Botão do Lattes -->
          <a href="https://buscatextual.cnpq.br/buscatextual/visualizacv.do;jsessionid=C2957863E16CF8BE97A0DA88A4B226F3.buscatextual_0" target="_blank" rel="noopener noreferrer" class="px-6 py-3 rounded-full border border-slate-600 hover:border-slate-300 text-slate-300 hover:text-white transition-all duration-300 hover:-translate-y-1 text-center">
            Currículo Lattes
          </a>
        </div>
      </div>

      <!-- Coluna da Foto -->
      <div class="animate-fade-up delay-500 w-full md:w-1/2 flex justify-center md:justify-end">
        <div class="relative w-64 h-64 md:w-96 md:h-96 animate-float">
          <!-- Efeito de brilho no fundo da foto -->
          <div class="absolute inset-0 bg-emerald-500 rounded-full blur-3xl opacity-20 transition-opacity duration-700 hover:opacity-40"></div>
          
          <!-- Container da Foto -->
          <div class="relative w-full h-full rounded-full overflow-hidden border-4 border-slate-700/50 hover:border-emerald-500/50 transition-colors duration-500 shadow-2xl">
            
            <img src="https://cdn.discordapp.com/attachments/1002490298963865681/1557906025313599558/69b16e39-5fa3-42c8-8206-623a412cccf7.png?ex=6ac9808c&is=6ac82f0c&hm=0908a0de9de02109e8ba0a6cbfed766e99315f67d00595c0d7049d841b6d952b&" alt="Foto de Kayque Olimpio" class="w-full h-full object-cover">
            
          </div>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
